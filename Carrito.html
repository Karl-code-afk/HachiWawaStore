<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | HachiWawa</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style_P.css">

    <!-- Vocaloid - Megurine Luka - https://www.cursors-4u.com/cursor/vocaloid-megurine-luka -->
    <link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/vocaloid-megurine-luka-44644ed4-34.css">
    <!-- End www.Cursors-4U.com Code -->
</head>

<body>
    <header>
        <h1>
            <img src="Logo.png" alt="Logo" class="logo-titulo">
            Carrito
        </h1>
        <nav>
            <a href="index.html" class="btn-volver-tienda">Volver a la tienda</a>
        </nav>
    </header>

    <main>
        <section class="formulario-pago" style="max-width: 700px; margin: 40px auto;">
            <div id="lista-carrito"></div>
            <hr style="border: 1px solid #ffbee1; margin: 20px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: #ff69b4; margin: 0;">Total: $<span id="total-pago">0.00</span></h3>

                <button class="btn-comprar" onclick="window.open('checkout.html', '_blank')">Ir a Pagar</button>
            </div>
        </section>
    </main>

    <script src="Carrito.js"></script>
</body>

</html>
